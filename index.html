<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metodologias Ativas: Aprender fazendo, ensinar transformando</title>
<link rel="icon" type="image/x-icon" href="https://www.cogna.com.br/favicon.ico">
<style>
  :root {
    --primary: #5219A1;
    --accent: #ffad01;
    --primary-light: #6d3fc0;
    --error: #d63333;
    --success: #2e9e5b;
    --bg: #f3f0fa;
    --text: #2c2340;
    --border: #d9d0ec;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, #ffffff 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }

  .card {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 35px rgba(82, 25, 161, 0.15);
    overflow: hidden;
  }

  .card-header {
    background: linear-gradient(120deg, var(--primary) 0%, var(--primary-light) 100%);
    padding: 28px 32px;
    position: relative;
  }

  .card-header::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    height: 5px;
    width: 100%;
    background: var(--accent);
  }

  .card-header h1 {
    color: #fff;
    margin: 0 0 6px 0;
    font-size: 1.5rem;
  }

  .card-header p {
    color: #e6dcfa;
    margin: 0;
    font-size: 0.92rem;
  }

  .card-header .logo {
    height: 40px;
    max-width: 180px;
    object-fit: contain;
    display: block;
    margin-bottom: 14px;
  }

  form {
    padding: 28px 32px 32px 32px;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-weight: 600;
    font-size: 0.88rem;
    margin-bottom: 6px;
    color: var(--primary);
  }

  label .required {
    color: var(--accent);
  }

  input[type="text"],
  input[type="email"],
  input[type="tel"],
  select {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: #fff;
    color: var(--text);
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(82, 25, 161, 0.15);
  }

  input.invalid, select.invalid {
    border-color: var(--error);
  }

  input.valid, select.valid {
    border-color: var(--success);
  }

  select:disabled,
  input:disabled {
    background: #f4f2f8;
    color: #9a90b0;
    cursor: not-allowed;
  }

  .hint {
    font-size: 0.78rem;
    margin-top: 5px;
    min-height: 14px;
  }

  .hint.error { color: var(--error); }
  .hint.ok { color: var(--success); }

  button[type="submit"] {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #4a2e00;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.1s, filter 0.15s;
  }

  button[type="submit"]:hover {
    filter: brightness(1.05);
  }

  button[type="submit"]:active {
    transform: translateY(1px);
  }

  button[type="submit"]:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  #formMsg {
    text-align: center;
    margin-top: 16px;
    font-weight: 600;
    display: none;
  }

  #formMsg.show { display: block; }
  #formMsg.success { color: var(--success); }
  #formMsg.error { color: var(--error); }

  .message-container {
    padding: 28px 32px;
    text-align: center;
  }

  .message-container h2 {
    color: var(--primary);
    font-size: 1.3rem;
    margin: 0 0 12px 0;
  }

  .message-container p {
    color: #666;
    font-size: 1rem;
    margin: 0;
  }

  .unidade-count {
    font-size: 0.78rem;
    color: #6b6280;
    margin-top: 5px;
  }

  /* ===================== Combobox (Unidade) ===================== */
  .combobox {
    position: relative;
  }

  .combobox-list {
    list-style: none;
    margin: 0;
    padding: 6px 0;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    max-height: 280px;
    overflow-y: auto;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(82, 25, 161, 0.2);
    z-index: 30;
    display: none;
    -webkit-overflow-scrolling: touch;
  }

  .combobox-list.open {
    display: block;
  }

  .combobox-option {
    padding: 12px 14px;
    font-size: 0.92rem;
    cursor: pointer;
    line-height: 1.35;
  }

  .combobox-option.active,
  .combobox-option:hover {
    background: var(--bg);
  }

  .combobox-empty,
  .combobox-info {
    padding: 12px 14px;
    font-size: 0.85rem;
    color: #7a7090;
  }

  .combobox-info {
    border-top: 1px solid var(--border);
    font-style: italic;
  }

  /* Em telas pequenas, a lista vira um painel fixo (bottom sheet) para melhor toque */
  @media (max-width: 560px) {
    .combobox-list.open {
      position: fixed;
      left: 12px;
      right: 12px;
      top: auto;
      bottom: 12px;
      max-height: 55vh;
      box-shadow: 0 -8px 28px rgba(82, 25, 161, 0.3);
    }

    .combobox-option {
      padding: 14px 16px;
      font-size: 1rem;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <img src="https://portalinstitucional-assets.azureedge.net/strapi/assets/cogna_fd8c0b077b_1_7f0524b5f3.png" alt="Cogna" class="logo">
    <h1>Metodologias Ativas: Aprender fazendo, ensinar transformando</h1>
    <p>Preencha os campos abaixo com seus dados.</p>
  </div>

  <div class="message-container">
    <h2>Inscrições encerradas</h2>
  </div>
</div>

</body>
</html>
